name: Build Scarlet Rust Toolchain

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-14
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: petitstrawberry/rust
          ref: b9573d6cd0731d24486f77ddf24d502e2e6bef02
          path: rust-src
          submodules: false
          fetch-depth: 1

      - name: Initialize Rust source submodules
        working-directory: rust-src
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '{ print $2 }' \
            > ../rust-submodules.txt

          while IFS= read -r submodule
          do
            git submodule update --init --depth 1 -- "$submodule"
          done < ../rust-submodules.txt

      - name: Create clean Rust source tree
        working-directory: rust-src
        run: |
          mkdir -p ../rust-source-clean
          git archive --format=tar HEAD | tar -xf - -C ../rust-source-clean

          while IFS= read -r submodule
          do
            mkdir -p "../rust-source-clean/$submodule"
            git -C "$submodule" archive --format=tar HEAD | tar -xf - -C "../rust-source-clean/$submodule"
          done < ../rust-submodules.txt

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        if: env.CACHIX_CACHE_NAME != '' && env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: '${{ env.CACHIX_AUTH_TOKEN }}'

      - name: Build vendored Rust source
        run: nix build .#packages.${{ matrix.system }}.scarlet-rust-vendored-src --override-input rust-src path:./rust-source-clean -L --accept-flake-config

      - name: Build toolchain
        run: nix build .#packages.${{ matrix.system }}.scarlet-rust-toolchain --override-input rust-src path:./rust-source-clean -L --accept-flake-config

      - name: Check toolchain
        run: nix flake check . --override-input rust-src path:./rust-source-clean --system ${{ matrix.system }} -L --accept-flake-config
