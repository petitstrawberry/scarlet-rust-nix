name: Build Scarlet Rust Toolchain

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-14
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        if: env.CACHIX_CACHE_NAME != '' && env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: '${{ env.CACHIX_AUTH_TOKEN }}'
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: '(-source$|-vendored-src$|\.tar\.gz$)'

      - name: Build Scarlet LLVM
        run: nix build .#packages.${{ matrix.system }}.scarlet-llvm -L --accept-flake-config

      - name: Build toolchain
        run: nix build .#packages.${{ matrix.system }}.scarlet-rust-toolchain -L --accept-flake-config

      - name: Check toolchain
        run: nix flake check . --system ${{ matrix.system }} -L --accept-flake-config

  pin:
    name: Pin latest (${{ matrix.system }})
    needs: build
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-14
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        if: env.CACHIX_CACHE_NAME != '' && env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: '${{ env.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      - name: Pin latest selected paths
        if: env.CACHIX_CACHE_NAME != '' && env.CACHIX_AUTH_TOKEN != ''
        run: |
          nix build .#packages.${{ matrix.system }}.scarlet-rust-toolchain -L --accept-flake-config

          # The package has multiple outputs (out, man, doc); pin the toolchain's
          # main output explicitly instead of relying on path-info ordering.
          TC_PATH="$(nix eval --raw .#packages.${{ matrix.system }}.scarlet-rust-toolchain.outPath --accept-flake-config)"

          echo "Pinning: ${TC_PATH}"
          cachix pin "$CACHIX_CACHE_NAME" "latest-${{ matrix.system }}" "$TC_PATH" \
            --keep-revisions 1
