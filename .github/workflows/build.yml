name: Build Scarlet Rust Toolchain

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: scarlet-toolchain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native_changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.paths.outputs.host }}
      linker: ${{ steps.paths.outputs.linker }}
    steps:
      - name: Select native builds affected by this PR
        id: paths
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const paths = files.flatMap(file =>
              [file.filename, file.previous_filename].filter(Boolean));
            const sameRepository = context.payload.pull_request.head.repo.full_name
              === `${context.repo.owner}/${context.repo.repo}`;
            // Native build commands live in their reusable workflows. Release
            // orchestration changes run automation tests without recompiling Rust.
            const shared = path => ['flake.nix', 'flake.lock'].includes(path)
              || path.startsWith('nix/');
            const host = paths.some(path => shared(path)
              || path.startsWith('native-host/')
              || path === '.github/workflows/native-host.yml'
              || /^scripts\/.*native[-_]host/.test(path));
            const linker = paths.some(path => shared(path)
              || path.startsWith('native-linker/')
              || path === '.github/workflows/native-linker.yml'
              || /^scripts\/.*native[-_]linker/.test(path));
            // Fork PRs cannot upload the prerequisite closure to our Cachix.
            core.setOutput('host', String(sameRepository && host));
            core.setOutput('linker', String(sameRepository && linker));

  protect-consumers:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/protect-consumers.yml
    secrets: inherit

  build:
    needs: protect-consumers
    if: ${{ !cancelled() && (needs.protect-consumers.result == 'success' || needs.protect-consumers.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-14
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check automation scripts
        run: |
          node --test scripts/*.test.cjs
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        if: env.CACHIX_CACHE_NAME != '' && env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: '${{ env.CACHIX_AUTH_TOKEN }}'
          # Publish only after checks succeed, including on same-repository PRs.
          skipPush: true

      - name: Build toolchain
        run: nix build .#packages.${{ matrix.system }}.scarlet-rust-toolchain -L --accept-flake-config

      - name: Check toolchain
        run: nix flake check . --system ${{ matrix.system }} -L --accept-flake-config

      - name: Upload checked toolchain to Cachix
        if: env.CACHIX_CACHE_NAME != '' && env.CACHIX_AUTH_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          # Push the complete runtime closure, including already-substituted paths.
          # No pin is created for PRs. The merge job waits for every upload.
          nix build --no-link --print-out-paths '.#packages.${{ matrix.system }}.scarlet-rust-toolchain^*' \
            --accept-flake-config | cachix push "${CACHIX_CACHE_NAME}"

  native_host:
    needs: [build, native_changes]
    if: github.event_name == 'pull_request' && needs.native_changes.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-scarlet, riscv64gc-unknown-scarlet]
    uses: ./.github/workflows/native-host.yml
    with:
      target: ${{ matrix.target }}
    secrets: inherit

  native_linker:
    needs: [build, native_changes]
    if: github.event_name == 'pull_request' && needs.native_changes.outputs.linker == 'true'
    uses: ./.github/workflows/native-linker.yml
    secrets: inherit

  ci:
    name: Toolchain CI
    needs: [build, native_changes, native_host, native_linker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require cross builds, cache uploads, and affected native builds
        env:
          CROSS: ${{ needs.build.result }}
          CHANGES: ${{ needs.native_changes.result }}
          HOST_REQUIRED: ${{ needs.native_changes.outputs.host }}
          LINKER_REQUIRED: ${{ needs.native_changes.outputs.linker }}
          HOST: ${{ needs.native_host.result }}
          LINKER: ${{ needs.native_linker.result }}
        run: |
          test "$CROSS" = success
          case "$CHANGES" in success|skipped) ;; *) exit 1 ;; esac
          if [[ "$HOST_REQUIRED" == true ]]; then
            test "$HOST" = success
          else
            test "$HOST" = skipped
          fi
          if [[ "$LINKER_REQUIRED" == true ]]; then
            test "$LINKER" = success
          else
            test "$LINKER" = skipped
          fi

  merge-update:
    name: Merge checked Rust update
    needs: [build, ci]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'automation/rust-update'
    runs-on: ubuntu-latest
    steps:
      # Execute the merger from the trusted base, never from the updated Rust source.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.SCARLET_RUST_NIX_UPDATE_TOKEN }}
          script: |
            const merge = require('./scripts/merge-rust-update.cjs');
            await merge({ github, context, core });

  pin:
    name: Pin latest and Scarlet consumers
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/protect-consumers.yml
    with:
      latest_rev: ${{ github.sha }}
    secrets: inherit

  native_release:
    name: Publish native toolchain and update Scarlet
    needs: [build, ci, pin]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.ci.result == 'success' && needs.pin.result == 'success' }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/native-toolchain-release.yml
    secrets: inherit
