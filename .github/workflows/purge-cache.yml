name: Purge Cachix Cache

on:
  workflow_dispatch:

jobs:
  purge:
    name: Purge stale cache entries
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        if: env.CACHIX_CACHE_NAME != '' && env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: '${{ env.CACHIX_AUTH_TOKEN }}'
          pushFilter: ".*"

      - uses: actions/checkout@v4

      - name: Resolve current store paths
        id: current
        run: |
          LLVM_X86="$(nix eval --raw .#packages.x86_64-linux.scarlet-llvm.outPath --accept-flake-config)"
          LLVM_ARM64="$(nix eval --raw .#packages.aarch64-linux.scarlet-llvm.outPath --accept-flake-config)"
          LLVM_DARWIN="$(nix eval --raw .#packages.aarch64-darwin.scarlet-llvm.outPath --accept-flake-config)"
          TC_X86="$(nix eval --raw .#packages.x86_64-linux.scarlet-rust-toolchain.outPath --accept-flake-config)"
          TC_ARM64="$(nix eval --raw .#packages.aarch64-linux.scarlet-rust-toolchain.outPath --accept-flake-config)"
          TC_DARWIN="$(nix eval --raw .#packages.aarch64-darwin.scarlet-rust-toolchain.outPath --accept-flake-config)"
          {
            echo "llvm_x86=$LLVM_X86"
            echo "llvm_arm64=$LLVM_ARM64"
            echo "llvm_darwin=$LLVM_DARWIN"
            echo "tc_x86=$TC_X86"
            echo "tc_arm64=$TC_ARM64"
            echo "tc_darwin=$TC_DARWIN"
          } >> "$GITHUB_OUTPUT"

      - name: Delete stale cache entries
        if: env.CACHIX_CACHE_NAME != '' && env.CACHIX_AUTH_TOKEN != ''
        run: |
          KEEP="$LLVM_X86 $LLVM_ARM64 $LLVM_DARWIN $TC_X86 $TC_ARM64 $TC_DARWIN"
          echo "=== Keeping ==="
          for p in $KEEP; do echo "  $p"; done
          echo ""
          echo "=== Scanning cache ==="
          cachix list-paths "$CACHIX_CACHE_NAME" | while read -r path; do
            case " $KEEP " in
              *" $path "*) echo "KEEP   $path" ;;
              *)           echo "DELETE $path"; cachix delete "$CACHIX_CACHE_NAME" "$path" || true ;;
            esac
          done
          echo ""
          echo "=== Done ==="
        env:
          LLVM_X86: ${{ steps.current.outputs.llvm_x86 }}
          LLVM_ARM64: ${{ steps.current.outputs.llvm_arm64 }}
          LLVM_DARWIN: ${{ steps.current.outputs.llvm_darwin }}
          TC_X86: ${{ steps.current.outputs.tc_x86 }}
          TC_ARM64: ${{ steps.current.outputs.tc_arm64 }}
          TC_DARWIN: ${{ steps.current.outputs.tc_darwin }}
