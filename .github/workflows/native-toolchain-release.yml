name: Publish Scarlet Native Rust Toolchain

on:
  # The caller has checked all cross toolchains and published their Cachix closure.
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      version: ${{ steps.plan.outputs.version }}
      published: ${{ steps.plan.outputs.published }}
      scarlet_commit: ${{ steps.plan.outputs.scarlet_commit }}
      aarch64_run: ${{ steps.plan.outputs.aarch64_run }}
      riscv64_run: ${{ steps.plan.outputs.riscv64_run }}
      linker_run: ${{ steps.plan.outputs.linker_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find successful artifacts with matching build inputs
        id: plan
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            await require('./scripts/native-artifacts.cjs').plan({ github, context, core });
      - name: Check bundle update credentials before building
        if: steps.plan.outputs.skip != 'true'
        env:
          UPDATE_TOKEN: ${{ secrets.SCARLET_RUST_NIX_UPDATE_TOKEN }}
        run: test -n "$UPDATE_TOKEN"
      - name: Check access to the Scarlet consumer
        if: steps.plan.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.SCARLET_RUST_NIX_UPDATE_TOKEN }}
          script: |
            const { data } = await github.rest.repos.get({ owner: 'petitstrawberry', repo: 'Scarlet' });
            if (!data.permissions?.push) {
              throw new Error('SCARLET_RUST_NIX_UPDATE_TOKEN needs contents write access to petitstrawberry/Scarlet');
            }

  aarch64:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.published != 'true' && needs.plan.outputs.aarch64_run == ''
    uses: ./.github/workflows/native-host.yml
    with:
      target: aarch64-unknown-scarlet
    secrets: inherit

  riscv64:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.published != 'true' && needs.plan.outputs.riscv64_run == ''
    uses: ./.github/workflows/native-host.yml
    with:
      target: riscv64gc-unknown-scarlet
    secrets: inherit

  linker:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.published != 'true' && needs.plan.outputs.linker_run == ''
    uses: ./.github/workflows/native-linker.yml
    secrets: inherit

  package:
    name: Package ${{ matrix.target }}
    needs: [plan, aarch64, riscv64, linker]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' && needs.plan.outputs.published != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-scarlet
            arch: aarch64
          - target: riscv64gc-unknown-scarlet
            arch: riscv64
    env:
      GH_TOKEN: ${{ github.token }}
      HOST_RUN: ${{ (matrix.arch == 'aarch64' && needs.plan.outputs.aarch64_run || matrix.arch == 'riscv64' && needs.plan.outputs.riscv64_run) || github.run_id }}
      LINKER_RUN: ${{ needs.plan.outputs.linker_run || github.run_id }}
      VERSION: ${{ needs.plan.outputs.version }}
      SCARLET_COMMIT: ${{ needs.plan.outputs.scarlet_commit }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check packaging code
        run: |
          bash -n scripts/fetch-native-host.sh scripts/fetch-native-linker.sh scripts/build-native-toolchain-release.sh
          python3 -m unittest scripts/test_native_toolchain_package.py -v
      - name: Install archive compressor
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes zstd
          fi
      - name: Download matching native compiler and linker
        run: |
          scripts/fetch-native-host.sh "$HOST_RUN" "$TARGET" "$RUNNER_TEMP/native-host-artifact"
          scripts/fetch-native-linker.sh "$LINKER_RUN" "$TARGET" "$RUNNER_TEMP/native-linker-artifact"
      - name: Package the native toolchain
        run: |
          scripts/build-native-toolchain-release.sh \
            --native-host "$RUNNER_TEMP/native-host-artifact" \
            --native-linker "$RUNNER_TEMP/native-linker-artifact" \
            --target "$TARGET" --version "$VERSION" \
            --scarlet-commit "$SCARLET_COMMIT" --output release-assets
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: native-toolchain-release-${{ matrix.arch }}
          overwrite: true
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish both architectures and update Scarlet
    needs: [plan, package]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' && (needs.plan.outputs.published == 'true' || needs.package.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download both release candidates
        if: needs.plan.outputs.published != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: native-toolchain-release-*
          path: release-assets
          merge-multiple: true
      - name: Recover metadata when retrying a published release
        if: needs.plan.outputs.published == 'true'
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.manifest.json' --pattern '*.sha256' --dir release-assets
      - name: Publish the complete prerelease
        id: publish
        uses: actions/github-script@v8
        with:
          script: |
            require('./scripts/update-native-bundle.cjs').releaseInputs('release-assets', context.sha);
            await require('./scripts/native-artifacts.cjs').publish({ github, context, core });
      - name: Update the Scarlet bundle and current symlink atomically
        if: steps.publish.outputs.published == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.SCARLET_RUST_NIX_UPDATE_TOKEN }}
          script: |
            await require('./scripts/update-native-bundle.cjs')({ github, context, core });
