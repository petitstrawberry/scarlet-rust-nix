name: Update Scarlet Rust Revision

on:
  workflow_dispatch:
    inputs:
      rust_rev:
        description: "Full Rust fork revision to package. If empty, the configured ref is used."
        required: false
        type: string
      rust_ref:
        description: "Rust fork branch/tag to check when rust-rev is empty."
        required: false
        default: "scarlet-target"
        type: string
  repository_dispatch:
    types: [rust-updated]
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-scarlet-rust-revision
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.rust.outputs.changed }}
      current_rev: ${{ steps.rust.outputs.current_rev }}
      rev: ${{ steps.rust.outputs.rev }}
      short_rev: ${{ steps.rust.outputs.short_rev }}
      ref: ${{ steps.rust.outputs.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_REPOSITORY: petitstrawberry/rust
      DEFAULT_RUST_REF: scarlet-target

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Resolve Rust revision
        id: rust
        run: |
          set -euo pipefail

          rust_rev="${{ github.event.client_payload.rev || inputs.rust_rev || '' }}"
          rust_ref="${{ github.event.client_payload.ref || inputs.rust_ref || '' }}"
          rust_ref="${rust_ref:-${DEFAULT_RUST_REF}}"

          if [ -z "${rust_rev}" ]; then
            rust_rev="$(gh api "repos/${RUST_REPOSITORY}/commits/${rust_ref}" --jq .sha)"
          fi

          if ! printf '%s' "${rust_rev}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid Rust revision: ${rust_rev}" >&2
            exit 1
          fi

          current_rev="$(sed -n 's/^[[:space:]]*rustRev = "\([0-9a-f]\{40\}\)";/\1/p' flake.nix)"
          short_rev="$(printf '%s' "${rust_rev}" | cut -c1-12)"

          echo "rev=${rust_rev}" >> "${GITHUB_OUTPUT}"
          echo "short_rev=${short_rev}" >> "${GITHUB_OUTPUT}"
          echo "current_rev=${current_rev}" >> "${GITHUB_OUTPUT}"
          echo "ref=${rust_ref}" >> "${GITHUB_OUTPUT}"

          if [ "${current_rev}" = "${rust_rev}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Stop when already current
        if: steps.rust.outputs.changed == 'false'
        run: echo "scarlet-rust-nix already packages ${{ steps.rust.outputs.rev }}."

  compute-hashes:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-14
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Compute hashes
        run: |
          set -euo pipefail

          scripts/update-rust-rev.sh "${{ needs.resolve.outputs.rev }}" "${{ matrix.system }}"

          rust_hash="$(sed -n 's/^[[:space:]]*rustHash = "\(sha256-[^"]*\)";/\1/p' flake.nix)"
          vendored_hash="$(sed -n 's/^[[:space:]]*${{ matrix.system }} = "\(sha256-[^"]*\)";/\1/p' nix/vendor-rust-src.nix)"

          mkdir -p .rust-update-hashes
          {
            echo "system=${{ matrix.system }}"
            echo "rust_hash=${rust_hash}"
            echo "vendored_hash=${vendored_hash}"
          } > ".rust-update-hashes/${{ matrix.system }}.env"

      - uses: actions/upload-artifact@v4
        with:
          name: rust-update-${{ matrix.system }}
          path: .rust-update-hashes/${{ matrix.system }}.env
          if-no-files-found: error

  update:
    needs:
      - resolve
      - compute-hashes
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: rust-update-*
          path: .rust-update-hashes
          merge-multiple: true

      - name: Apply update
        run: scripts/apply-rust-update-hashes.sh "${{ needs.resolve.outputs.rev }}" .rust-update-hashes

      - name: Create update PR
        env:
          PR_TOKEN: ${{ secrets.SCARLET_RUST_NIX_UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          branch="automation/rust-${{ needs.resolve.outputs.short_rev }}"
          title="Update Scarlet Rust to ${{ needs.resolve.outputs.short_rev }}"
          body="Updates the packaged Scarlet Rust fork revision to ${{ needs.resolve.outputs.rev }}."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          remote_head="$(git ls-remote --heads origin "${branch}" | cut -f1)"

          git checkout -B "${branch}"
          git add flake.nix nix/vendor-rust-src.nix scripts/update-rust-rev.sh scripts/apply-rust-update-hashes.sh .github/workflows/update-rust.yml
          git commit -m "${title}"

          if [ -n "${remote_head}" ]; then
            git push --force-with-lease="refs/heads/${branch}:${remote_head}" origin "${branch}"
          else
            git push origin "${branch}"
          fi

          if [ -z "${PR_TOKEN}" ]; then
            echo "::error::SCARLET_RUST_NIX_UPDATE_TOKEN is required to create or update pull requests from GitHub Actions."
            exit 1
          fi
          export GH_TOKEN="${PR_TOKEN}"

          if gh pr view "${branch}" --json number >/dev/null 2>&1; then
            gh pr edit "${branch}" \
              --title "${title}" \
              --body "${body}"
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "${title}" \
              --body "${body}"
          fi
